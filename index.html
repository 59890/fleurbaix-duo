<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trail de Fleurbaix — Duo</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Trail Duo">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --pink: #f43f5e;
      --pink-dark: #be123c;
      --pink-soft: rgba(244, 63, 94, 0.15);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #10b981;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px 12px 60px;
      line-height: 1.4;
    }

    .container { max-width: 650px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .badge-race {
      display: inline-block;
      background: var(--pink-soft);
      color: var(--pink);
      border: 1px solid var(--pink);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-top: 6px;
    }

    /* Live status indicator */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 12px 0 16px;
      padding: 8px 14px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #eab308;
    }

    .status-dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .status-dot.syncing { background: #38bdf8; animation: pulse 1s infinite; }
    .status-dot.error { background: #ef4444; }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    /* Tabs */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 12px 8px;
      border-radius: var(--radius);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--pink-soft);
      border-color: var(--pink);
      color: #fff;
    }

    .progress-bar-bg {
      width: 80%;
      height: 6px;
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--pink);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Weeks list */
    .week-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    .week-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #e2e8f0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 6px;
    }

    .week-tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      color: var(--text-muted);
    }

    .week-tag.relache { background: rgba(16, 185, 129, 0.15); color: var(--green); }
    .week-tag.race { background: var(--pink-soft); color: var(--pink); font-weight: bold; }

    /* Workout row */
    .session {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 6px;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
    }

    .session:not(:last-child) {
      margin-bottom: 4px;
    }

    .session input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border: 2px solid #64748b;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-content: center;
      margin-top: 2px;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .session input[type="checkbox"]:checked {
      background: var(--pink);
      border-color: var(--pink);
    }

    .session input[type="checkbox"]:checked::before {
      content: "✓";
      color: #fff;
      font-size: 16px;
      font-weight: 900;
    }

    .session-info { flex-grow: 1; }
    .session-title { font-weight: 600; font-size: 0.9rem; }
    .session-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 1px; }

    .session.done .session-title {
      text-decoration: line-through;
      color: #64748b;
    }
    .session.done .session-desc {
      color: #475569;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Trail de Fleurbaix 🌿</h1>
    <div class="badge-race">Objectif : 16 km • 7 Mars 2027</div>
  </header>

  <div class="status-bar">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Connexion à Firebase...</span>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-her" onclick="switchProfile('her')">
      <span>Elle 🏃‍♀️ (Débutante)</span>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-her"></div></div>
      <span style="font-size: 0.7rem; font-weight: 400;" id="label-her">0 / 40 séances</span>
    </button>
    <button class="tab-btn" id="tab-him" onclick="switchProfile('him')">
      <span>Lui 🏃‍♂️ (Reprise)</span>
      <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-him"></div></div>
      <span style="font-size: 0.7rem; font-weight: 400;" id="label-him">0 / 40 séances</span>
    </button>
  </div>

  <main id="schedule-container"></main>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCrheBYiuNYs6KQcr0lusyoKwF9RrV5N-8",
    authDomain: "fleurbaix-duo.firebaseapp.com",
    projectId: "fleurbaix-duo",
    storageBucket: "fleurbaix-duo.firebasestorage.app",
    messagingSenderId: "869351146672",
    appId: "1:869351146672:web:033e09784ffa036715e775",
    measurementId: "G-3ZT1F8QX48"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const docRef = doc(db, "plans", "fleurbaix-duo");

  let currentProfile = 'her';
  let sharedState = {};

  // Plan data (20 weeks x 2 sessions)
  const plans = {
    her: [
      { w: 1, tag: "Bases", s1: "4 km endurance douce", s2: "5 km en continu (33 min)" },
      { w: 2, tag: "Bases", s1: "4,5 km régulier", s2: "5,5 km sortie longue facile" },
      { w: 3, tag: "Bases", s1: "5 km footing souple", s2: "6 km sortie longue" },
      { w: 4, tag: "Relâche", isRelache: true, s1: "4 km footing très cool", s2: "5 km footing facile" },
      { w: 5, tag: "Volume", s1: "5 km + 3 accélérations 30s", s2: "7 km sortie longue" },
      { w: 6, tag: "Volume", s1: "5,5 km endurance", s2: "7,5 km sortie longue" },
      { w: 7, tag: "Volume", s1: "5 km + 3x 1 min dynamique", s2: "8,5 km sortie longue" },
      { w: 8, tag: "Relâche", isRelache: true, s1: "4 km footing facile", s2: "6 km sortie longue" },
      { w: 9, tag: "Fartlek", s1: "5 km dont 4x 1 min vite / 1 min marche", s2: "9,5 km sortie longue" },
      { w: 10, tag: "Cap 10 km", s1: "6 km endurance", s2: "10,5 km sortie longue 🎯" },
      { w: 11, tag: "Fartlek", s1: "5,5 km dont 3x 2 min allure cible", s2: "11 km sortie longue" },
      { w: 12, tag: "Relâche", isRelache: true, s1: "4 km cool", s2: "7 km sortie facile" },
      { w: 13, tag: "Trail", s1: "6 km footing nature", s2: "12 km chemins & sentiers" },
      { w: 14, tag: "Pic max", s1: "6 km avec faux-plats", s2: "13 km sortie longue (Pic)" },
      { w: 15, tag: "Relâche", isRelache: true, s1: "5 km cool", s2: "8 km sortie cool" },
      { w: 16, tag: "Spécifique", s1: "6 km endurance active", s2: "11 km sur sentier vallonné" },
      { w: 17, tag: "Affûtage", s1: "5 km footing souple", s2: "10 km sortie nature" },
      { w: 18, tag: "Affûtage", s1: "5 km régulier", s2: "8 km allure facile" },
      { w: 19, tag: "Affûtage", s1: "4 km cool + lignes droites", s2: "6 km très facile" },
      { w: 20, tag: "Course !", isRace: true, s1: "Mercredi : 3 km activation", s2: "Dimanche : Trail de Fleurbaix (16 km) 🏁" }
    ],
    him: [
      { w: 1, tag: "Sol souple", s1: "3,5 km herbe/terre + renfo mollets", s2: "4,5 km très facile" },
      { w: 2, tag: "Progressivité", s1: "4,5 km terrain meuble", s2: "5,5 km footing régulier" },
      { w: 3, tag: "Progressivité", s1: "5 km souple + étirements", s2: "6 km sortie souple" },
      { w: 4, tag: "Relâche", isRelache: true, s1: "4 km footing très doux", s2: "5 km plat" },
      { w: 5, tag: "Volume", s1: "5,5 km avec faux-plat montant", s2: "7 km terrain varié" },
      { w: 6, tag: "Volume", s1: "6 km endurance souple", s2: "8 km sortie longue" },
      { w: 7, tag: "Impacts", s1: "5,5 km + 4 lignes droites propres", s2: "9 km sortie progressive" },
      { w: 8, tag: "Relâche", isRelache: true, s1: "4,5 km facile", s2: "6,5 km souple" },
      { w: 9, tag: "Spécifique", s1: "6 km avec 4x 1 min trail tempo", s2: "10 km chemins" },
      { w: 10, tag: "Volume", s1: "6,5 km régulier", s2: "11 km sortie longue" },
      { w: 11, tag: "Spécifique", s1: "6 km avec 3x 2 min allure trail", s2: "12 km sortie longue" },
      { w: 12, tag: "Relâche", isRelache: true, s1: "5 km très cool", s2: "7,5 km sans forcer" },
      { w: 13, tag: "Sentiers", s1: "6,5 km allure spécifique", s2: "13 km chemins & relief" },
      { w: 14, tag: "Pic max", s1: "7 km vallonné", s2: "14 km sortie longue (Pic)" },
      { w: 15, tag: "Relâche", isRelache: true, s1: "5 km souple", s2: "8 km facile" },
      { w: 16, tag: "Trail rythme", s1: "6,5 km avec relances propres", s2: "12 km terrain meuble" },
      { w: 17, tag: "Affûtage", s1: "5,5 km endurance", s2: "10 km souple" },
      { w: 18, tag: "Affûtage", s1: "5 km facile", s2: "8 km très souple" },
      { w: 19, tag: "Affûtage", s1: "4 km + 3 déroulés souples", s2: "6 km régulier" },
      { w: 20, tag: "Course !", isRace: true, s1: "Mercredi : 3 km réveil musculaire", s2: "Dimanche : Trail de Fleurbaix (16 km) 🏁" }
    ]
  };

  window.switchProfile = (p) => {
    currentProfile = p;
    document.getElementById('tab-her').classList.toggle('active', p === 'her');
    document.getElementById('tab-him').classList.toggle('active', p === 'him');
    render();
  };

  function updateStatus(type, msg) {
    const dot = document.getElementById('status-dot');
    const txt = document.getElementById('status-text');
    dot.className = 'status-dot ' + type;
    txt.textContent = msg;
  }

  function render() {
    const container = document.getElementById('schedule-container');
    const weeks = plans[currentProfile];

    container.innerHTML = weeks.map(item => {
      const id1 = `${currentProfile}_w${item.w}_s1`;
      const id2 = `${currentProfile}_w${item.w}_s2`;
      const done1 = !!sharedState[id1];
      const done2 = !!sharedState[id2];

      let tagClass = item.isRelache ? 'relache' : (item.isRace ? 'race' : '');

      return `
        <div class="week-card">
          <div class="week-header">
            <span>Semaine ${item.w}</span>
            <span class="week-tag ${tagClass}">${item.tag}</span>
          </div>
          <div class="session ${done1 ? 'done' : ''}" onclick="toggleSession('${id1}')">
            <input type="checkbox" ${done1 ? 'checked' : ''} onclick="event.stopPropagation(); toggleSession('${id1}')">
            <div class="session-info">
              <div class="session-title">Séance 1 (Mardi)</div>
              <div class="session-desc">${item.s1}</div>
            </div>
          </div>
          <div class="session ${done2 ? 'done' : ''}" onclick="toggleSession('${id2}')">
            <input type="checkbox" ${done2 ? 'checked' : ''} onclick="event.stopPropagation(); toggleSession('${id2}')">
            <div class="session-info">
              <div class="session-title">Séance 2 (Week-end)</div>
              <div class="session-desc">${item.s2}</div>
            </div>
          </div>
        </div>
      `;
    }).join('');

    updateProgressBars();
  }

  function updateProgressBars() {
    const countDone = (profile) => {
      let count = 0;
      for (let w = 1; w <= 20; w++) {
        if (sharedState[`${profile}_w${w}_s1`]) count++;
        if (sharedState[`${profile}_w${w}_s2`]) count++;
      }
      return count;
    };

    const countHer = countDone('her');
    const countHim = countDone('him');

    document.getElementById('progress-her').style.width = `${(countHer / 40) * 100}%`;
    document.getElementById('label-her').textContent = `${countHer} / 40 séances`;

    document.getElementById('progress-him').style.width = `${(countHim / 40) * 100}%`;
    document.getElementById('label-him').textContent = `${countHim} / 40 séances`;
  }

  window.toggleSession = async (id) => {
    sharedState[id] = !sharedState[id];
    render();
    updateStatus('syncing', 'Synchronisation en cours...');

    try {
      await setDoc(docRef, sharedState, { merge: true });
      updateStatus('online', 'Synchronisé en direct');
    } catch (e) {
      console.error(e);
      updateStatus('error', 'Erreur : vérifie les règles Firestore !');
    }
  };

  // Écoute en direct les changements sur Firebase
  onSnapshot(docRef, (snapshot) => {
    if (snapshot.exists()) {
      sharedState = snapshot.data();
      render();
    }
    updateStatus('online', 'Connecté & synchronisé en direct');
  }, (err) => {
    console.error(err);
    updateStatus('error', 'Accès refusé (active le mode test Firestore)');
  });

  render();
</script>

</body>
</html>
