<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord - Duo Trail de Fleurbaix (7 Mars 2027)</title>
    <!-- Tailwind CSS pour un design moderne et responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 sm:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header duo personnalisé -->
        <header class="bg-gradient-to-r from-indigo-900 via-purple-900 to-rose-700 text-white p-6 sm:p-8 rounded-2xl shadow-xl mb-8">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <span class="bg-white/20 text-white text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider backdrop-blur-md">Objectif Commun : 7 Mars 2027</span>
                    <h1 class="text-2xl sm:text-4xl font-bold mt-2">Trail de 16 km de Fleurbaix - Duo 🏃‍♂️🏃‍♀️</h1>
                    <p class="text-indigo-100 mt-1 text-sm sm:text-base">Séances communes synchronisées (Lui : Reprise / Elle : Débutante 5km en 33min)</p>
                </div>
                <div class="flex gap-4">
                    <!-- Progress Lui -->
                    <div class="bg-white/10 backdrop-blur-md p-3 rounded-xl border border-white/20 text-center min-w-[130px]">
                        <div class="text-[10px] text-indigo-200 uppercase tracking-wider font-semibold">Progression Lui</div>
                        <div id="progress-text-lui" class="text-xl font-bold">0 / 46</div>
                        <div class="w-full bg-indigo-950/40 h-1.5 rounded-full mt-1 overflow-hidden">
                            <div id="progress-bar-lui" class="bg-indigo-400 h-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                    <!-- Progress Elle -->
                    <div class="bg-white/10 backdrop-blur-md p-3 rounded-xl border border-white/20 text-center min-w-[130px]">
                        <div class="text-[10px] text-rose-200 uppercase tracking-wider font-semibold">Progression Elle</div>
                        <div id="progress-text-elle" class="text-xl font-bold">0 / 46</div>
                        <div class="w-full bg-rose-950/40 h-1.5 rounded-full mt-1 overflow-hidden">
                            <div id="progress-bar-elle" class="bg-rose-400 h-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Filtres par phase -->
        <div class="flex gap-2 overflow-x-auto pb-4 mb-6 scrollbar-none">
            <button onclick="filterPhase('all')" class="phase-btn px-4 py-2 rounded-xl text-sm font-medium bg-purple-900 text-white shadow-sm transition-all whitespace-nowrap">Toutes les phases</button>
            <button onclick="filterPhase('1')" class="phase-btn px-4 py-2 rounded-xl text-sm font-medium bg-white text-slate-600 hover:bg-slate-100 shadow-sm transition-all whitespace-nowrap">Phase 1 : Adaptation & Reprise</button>
            <button onclick="filterPhase('2')" class="phase-btn px-4 py-2 rounded-xl text-sm font-medium bg-white text-slate-600 hover:bg-slate-100 shadow-sm transition-all whitespace-nowrap">Phase 2 : Endurance & Volume</button>
            <button onclick="filterPhase('3')" class="phase-btn px-4 py-2 rounded-xl text-sm font-medium bg-white text-slate-600 hover:bg-slate-100 shadow-sm transition-all whitespace-nowrap">Phase 3 : Fartlek & Variantes</button>
            <button onclick="filterPhase('4')" class="phase-btn px-4 py-2 rounded-xl text-sm font-medium bg-white text-slate-600 hover:bg-slate-100 shadow-sm transition-all whitespace-nowrap">Phase 4 : Spécifique Trail</button>
            <button onclick="filterPhase('5')" class="phase-btn px-4 py-2 rounded-xl text-sm font-medium bg-white text-slate-600 hover:bg-slate-100 shadow-sm transition-all whitespace-nowrap">Phase 5 : Affûtage & Course</button>
        </div>

        <!-- Conteneur dynamique des semaines -->
        <div id="weeks-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Injecté dynamiquement par JS -->
        </div>
    </div>

    <script>
        // Plan duo synchronisé sur 23 semaines (du 28 sept 2026 au 7 mars 2027)
        const planData = [
            {
                phase: 1, title: "Phase 1 : Adaptation et régularité (Octobre)",
                weeks: [
                    { 
                        num: "S1", dates: "28 sept - 4 oct", note: "Prise de repères commune",
                        lui: { s1: "25 min footing très lent (chemins)", s2: "35 min (4 min course / 1 min marche)" },
                        elle: { s1: "4 km en endurance douce", s2: "5 km continus (autour de 33-34 min)" }
                    },
                    { 
                        num: "S2", dates: "5 oct - 11 oct", note: "Montée en douceur",
                        lui: { s1: "30 min course continue (souple)", s2: "40 min (5 min course / 1 min marche)" },
                        elle: { s1: "4,5 km en footing régulier", s2: "5,5 km sortie longue facile" }
                    },
                    { 
                        num: "S3", dates: "12 oct - 18 oct", note: "Premiers repères continus",
                        lui: { s1: "35 min course continue", s2: "45 min de footing continu" },
                        elle: { s1: "5 km footing continu", s2: "6 km sortie longue souple" }
                    },
                    { 
                        num: "S4", dates: "19 oct - 25 oct", note: "Semaine de relâche (-20%)",
                        lui: { s1: "25 min footing très cool", s2: "35 min footing cool" },
                        elle: { s1: "4 km footing très cool", s2: "5 km footing cool" }
                    }
                ]
            },
            {
                phase: 2, title: "Phase 2 : Construction de l'endurance (Novembre)",
                weeks: [
                    { 
                        num: "S5", dates: "26 oct - 1 nov", note: "Premières accélérations",
                        lui: { s1: "40 min footing + 3 acc. de 30s", s2: "50 min sortie longue (~7 km)" },
                        elle: { s1: "5 km + 3 accélérations de 30s", s2: "7 km sortie longue" }
                    },
                    { 
                        num: "S6", dates: "2 nov - 8 nov", note: "Consolidation du groupe",
                        lui: { s1: "45 min footing en endurance", s2: "1h00 sortie longue (~8,5 km)" },
                        elle: { s1: "5,5 km en endurance", s2: "7,5 km sortie longue" }
                    },
                    { 
                        num: "S7", dates: "9 nov - 15 nov", note: "Cap des 10 km en vue",
                        lui: { s1: "45 min + 3 fois 2 min dynamique", s2: "1h10 sortie longue (~10 km)" },
                        elle: { s1: "5 km + 3 fois 1 min dynamique", s2: "8,5 km sortie longue" }
                    },
                    { 
                        num: "S8", dates: "16 nov - 22 nov", note: "Semaine de récupération",
                        lui: { s1: "30 min cool", s2: "45 min sortie longue facile" },
                        elle: { s1: "4 km footing facile", s2: "6 km sortie longue facile" }
                    }
                ]
            },
            {
                phase: 3, title: "Phase 3 : Consolidation et Fartlek (Nov - Déc)",
                weeks: [
                    { 
                        num: "S9", dates: "23 nov - 29 nov", note: "Variations d'allure partagées",
                        lui: { s1: "45 min incluant 5x (1 min rapide / 1 min lent)", s2: "1h15 sortie longue (~11 km)" },
                        elle: { s1: "5 km incluant 4x (1 min vite / 1 min marche)", s2: "9,5 km sortie longue" }
                    },
                    { 
                        num: "S10", dates: "30 nov - 6 déc", note: "Solide volume en duo",
                        lui: { s1: "50 min en endurance", s2: "1h20 sortie longue (~12 km)" },
                        elle: { s1: "6 km en endurance", s2: "10,5 km sortie longue (1er 10 km !)" }
                    },
                    { 
                        num: "S11", dates: "7 déc - 13 déc", note: "Allure et résistance",
                        lui: { s1: "45 min incluant 4x (2 min vite / 1 min lent)", s2: "1h25 sortie longue (~12,5 km)" },
                        elle: { s1: "5,5 km incl. 3x (2 min cible / 1 min marche)", s2: "11 km sortie longue" }
                    },
                    { 
                        num: "S12", dates: "14 déc - 20 déc", note: "Trêve / Allègement",
                        lui: { s1: "35 min cool", s2: "50 min de sortie longue" },
                        elle: { s1: "4 km cool", s2: "7 km sortie longue" }
                    }
                ]
            },
            {
                phase: 4, title: "Phase 4 : Spécifique Trail & Pic (Déc - Janv)",
                weeks: [
                    { 
                        num: "S13", dates: "21 déc - 27 déc", note: "Gestion des fêtes",
                        lui: { s1: "50 min footing chemins", s2: "1h30 sortie longue (~13 km)" },
                        elle: { s1: "6 km footing (fêtes)", s2: "12 km sortie longue chemins" }
                    },
                    { 
                        num: "S14", dates: "28 déc - 3 janv", note: "Pic de volume maximum",
                        lui: { s1: "50 min avec relances en faux-plats", s2: "1h35 sortie longue (~14 km)" },
                        elle: { s1: "6 km avec faux-plats", s2: "13 km sortie longue" }
                    },
                    { 
                        num: "S15", dates: "4 janv - 10 janv", note: "Relâche indispensable",
                        lui: { s1: "40 min cool", s2: "1h00 sortie longue facile" },
                        elle: { s1: "5 km cool", s2: "8 km sortie longue facile" }
                    },
                    { 
                        num: "S16", dates: "11 janv - 17 janv", note: "Terrain typé trail",
                        lui: { s1: "50 min footing endurance", s2: "1h20 sortie longue (terrain trail)" },
                        elle: { s1: "6 km footing endurance", s2: "11 km sur terrain meuble / sentier" }
                    }
                ]
            },
            {
                phase: 5, title: "Phase 5 : Affûtage et Course (Janv - Mars)",
                weeks: [
                    { 
                        num: "S17", dates: "18 janv - 24 janv", note: "Descente progressive",
                        lui: { s1: "45 min cool", s2: "1h10 sortie longue" },
                        elle: { s1: "5 km cool", s2: "10 km sortie longue" }
                    },
                    { 
                        num: "S18", dates: "25 janv - 31 janv", note: "Allègement du corps",
                        lui: { s1: "40 min cool", s2: "50 min sortie longue" },
                        elle: { s1: "5 km cool", s2: "8 km sortie longue" }
                    },
                    { 
                        num: "S19", dates: "1 fév - 7 fév", note: "Fraîcheur musculaire",
                        lui: { s1: "30 min cool + 3 lignes droites", s2: "40 min footing très léger" },
                        elle: { s1: "4 km cool + lignes droites", s2: "6 km footing très léger" }
                    },
                    { 
                        num: "S20", dates: "8 fév - 14 fév", note: "Transition & Sécurité",
                        lui: { s1: "Semaine de transition / repos", s2: "Sortie libre 30 min cool" },
                        elle: { s1: "Transition / repos", s2: "5 km footing cool" }
                    },
                    { 
                        num: "S21", dates: "15 fév - 21 fév", note: "Stabilisation",
                        lui: { s1: "35 min cool", s2: "45 min de footing" },
                        elle: { s1: "5 km cool", s2: "7 km de footing" }
                    },
                    { 
                        num: "S22", dates: "22 fév - 28 fév", note: "Affûtage J-7",
                        lui: { s1: "30 min cool", s2: "35 min footing" },
                        elle: { s1: "4 km cool", s2: "5 km footing" }
                    },
                    { 
                        num: "S23", dates: "1 mars - 7 mars", note: "OBJECTIF JOUR J 🎯",
                        lui: { s1: "Mercredi 3 mars : 20 min léger", s2: "DIMANCHE 7 MARS : TRAIL DE FLEURBAIX (16 km)" },
                        elle: { s1: "Mercredi 3 mars : 3 km très léger", s2: "DIMANCHE 7 MARS : TRAIL DE FLEURBAIX (16 km)" }
                    }
                ]
            }
        ];

        // Charger l'état sauvegardé depuis le stockage local du navigateur
        let completedData = JSON.parse(localStorage.getItem('fleurbaix_duo_completed') || '{}');

        function renderPlan(filter = 'all') {
            const container = document.getElementById('weeks-container');
            container.innerHTML = '';

            let totalWorkouts = 0;
            let checkedLui = 0;
            let checkedElle = 0;

            planData.forEach(group => {
                if (filter !== 'all' && group.phase.toString() !== filter) return;

                const phaseDiv = document.createElement('div');
                phaseDiv.className = 'col-span-1 md:col-span-2 bg-purple-900/10 text-purple-900 font-semibold px-4 py-2 rounded-xl border border-purple-200 mt-4 mb-2';
                phaseDiv.innerText = group.title;
                container.appendChild(phaseDiv);

                group.weeks.forEach(week => {
                    totalWorkouts += 2; // par personne
                    const luiS1Key = `${week.num}_lui_s1`;
                    const luiS2Key = `${week.num}_lui_s2`;
                    const elleS1Key = `${week.num}_elle_s1`;
                    const elleS2Key = `${week.num}_elle_s2`;

                    if (completedData[luiS1Key]) checkedLui++;
                    if (completedData[luiS2Key]) checkedLui++;
                    if (completedData[elleS1Key]) checkedElle++;
                    if (completedData[elleS2Key]) checkedElle++;

                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col justify-between hover:shadow-md transition-shadow';
                    
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <span class="bg-purple-100 text-purple-800 font-bold px-3 py-1 rounded-lg text-sm">${week.num}</span>
                                <span class="text-xs font-medium text-slate-400">${week.dates}</span>
                            </div>

                            <div class="space-y-4 mt-3">
                                <!-- Bloc LUI -->
                                <div class="p-3 rounded-xl bg-indigo-50/60 border border-indigo-100">
                                    <div class="text-xs font-bold text-indigo-900 uppercase tracking-wider mb-2">👤 Lui (Reprise & Anti-Périostite)</div>
                                    <div class="space-y-2">
                                        <label class="flex items-start gap-2 cursor-pointer">
                                            <input type="checkbox" data-key="${luiS1Key}" ${completedData[luiS1Key] ? 'checked' : ''} onchange="toggleWorkout(this)" class="mt-0.5 w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                                            <span class="text-xs text-slate-700"><b>S1 :</b> ${week.lui.s1}</span>
                                        </label>
                                        <label class="flex items-start gap-2 cursor-pointer">
                                            <input type="checkbox" data-key="${luiS2Key}" ${completedData[luiS2Key] ? 'checked' : ''} onchange="toggleWorkout(this)" class="mt-0.5 w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                                            <span class="text-xs text-slate-700"><b>S2 :</b> ${week.lui.s2}</span>
                                        </label>
                                    </div>
                                </div>

                                <!-- Bloc ELLE -->
                                <div class="p-3 rounded-xl bg-rose-50/60 border border-rose-100">
                                    <div class="text-xs font-bold text-rose-900 uppercase tracking-wider mb-2">👩 Elle (Débutante 5km/33min)</div>
                                    <div class="space-y-2">
                                        <label class="flex items-start gap-2 cursor-pointer">
                                            <input type="checkbox" data-key="${elleS1Key}" ${completedData[elleS1Key] ? 'checked' : ''} onchange="toggleWorkout(this)" class="mt-0.5 w-4 h-4 text-rose-600 rounded border-slate-300 focus:ring-rose-500">
                                            <span class="text-xs text-slate-700"><b>S1 :</b> ${week.elle.s1}</span>
                                        </label>
                                        <label class="flex items-start gap-2 cursor-pointer">
                                            <input type="checkbox" data-key="${elleS2Key}" ${completedData[elleS2Key] ? 'checked' : ''} onchange="toggleWorkout(this)" class="mt-0.5 w-4 h-4 text-rose-600 rounded border-slate-300 focus:ring-rose-500">
                                            <span class="text-xs text-slate-700"><b>S2 :</b> ${week.elle.s2}</span>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 pt-3 border-t border-slate-100 flex justify-between items-center text-xs">
                            <span class="text-slate-400 italic">${week.note}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });

            // Update progress bars (sur 46 séances totales par personne)
            const totalPerPerson = 46;
            const percentLui = Math.round((checkedLui / totalPerPerson) * 100) || 0;
            const percentElle = Math.round((checkedElle / totalPerPerson) * 100) || 0;

            document.getElementById('progress-text-lui').innerText = `${checkedLui} / ${totalPerPerson}`;
            document.getElementById('progress-bar-lui').style.width = `${percentLui}%`;

            document.getElementById('progress-text-elle').innerText = `${checkedElle} / ${totalPerPerson}`;
            document.getElementById('progress-bar-elle').style.width = `${percentElle}%`;
        }

        function toggleWorkout(checkbox) {
            const key = checkbox.getAttribute('data-key');
            completedData[key] = checkbox.checked;
            // Sauvegarde automatique dans le navigateur
            localStorage.setItem('fleurbaix_duo_completed', JSON.stringify(completedData));
            
            const activeBtn = document.querySelector('.phase-btn.bg-purple-900');
            const activePhase = activeBtn ? activeBtn.getAttribute('onclick').match(/'(.*)'/)[1] : 'all';
            renderPlan(activePhase);
        }

        function filterPhase(phase) {
            document.querySelectorAll('.phase-btn').forEach(btn => {
                btn.classList.remove('bg-purple-900', 'text-white');
                btn.classList.add('bg-white', 'text-slate-600');
            });
            event.target.classList.remove('bg-white', 'text-slate-600');
            event.target.classList.add('bg-purple-900', 'text-white');
            renderPlan(phase);
        }

        window.onload = () => renderPlan('all');
    </script>
</body>
</html>
